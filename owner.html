<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Monarque Bot — Owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03060a; --bg2:#060d10; --card:#071412; --card2:#081815;
  --line:rgba(0,255,163,.22); --line2:rgba(0,224,255,.4);
  --text:#e8fff4; --muted:#5f8278;
  --green:#39ff9e; --green-deep:#0a6b45;
  --blue:#00e0ff; --blue-deep:#063f52;
  --fh:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --fm:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--fh);color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;
  background:
    radial-gradient(ellipse 600px 320px at 15% 0%, rgba(0,224,255,.10), transparent 60%),
    radial-gradient(ellipse 500px 300px at 90% 18%, rgba(57,255,158,.08), transparent 60%),
    var(--bg);
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 60px;position:relative;z-index:1;}

@keyframes neonFlicker{
  0%,100%{opacity:1;}
  92%{opacity:1;}93%{opacity:.4;}94%{opacity:1;}96%{opacity:.55;}97%{opacity:1;}
}
@keyframes dotBlink{
  0%,100%{background:var(--green);box-shadow:0 0 6px 1px rgba(57,255,158,.8);}
  50%{background:var(--blue);box-shadow:0 0 8px 2px rgba(0,224,255,.9);}
}
@keyframes btnGlow{
  0%,100%{box-shadow:0 0 18px -2px rgba(57,255,158,.55),0 0 34px -8px rgba(0,224,255,.5);}
  50%{box-shadow:0 0 26px 2px rgba(0,224,255,.65),0 0 46px -4px rgba(57,255,158,.6);}
}

.hero{position:relative;height:230px;margin:0 -16px 20px;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:saturate(1.15) brightness(.85);}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,6,10,.2) 0%,rgba(3,6,10,.6) 55%,var(--bg) 100%);}
.hero::before{content:'';position:absolute;inset:0;box-shadow:inset 0 -3px 24px -2px rgba(0,224,255,.5);pointer-events:none;}
.hero-text{position:absolute;left:20px;right:20px;bottom:16px;z-index:1;}
.hero-text .name{font-family:var(--fm);font-size:1.6rem;font-weight:700;letter-spacing:.03em;line-height:1;color:var(--green);text-shadow:0 0 6px rgba(57,255,158,.9),0 0 22px rgba(57,255,158,.5),0 0 44px rgba(0,224,255,.3);animation:neonFlicker 5s infinite;}
.hero-text .tag{font-size:.72rem;color:var(--blue);letter-spacing:.12em;text-transform:uppercase;margin-top:6px;font-weight:600;text-shadow:0 0 8px rgba(0,224,255,.6);}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 0 24px -14px rgba(0,224,255,.4);}

input[type=text],input[type=password]{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--text);
  padding:14px 15px;font-size:.9rem;outline:none;margin-bottom:14px;font-family:var(--fm);
  letter-spacing:.06em;transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus,input[type=password]:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(57,255,158,.15);}
input::placeholder{color:var(--muted);font-family:var(--fh);letter-spacing:normal;}

.btn{
  width:100%;background:linear-gradient(135deg,var(--green),var(--blue));color:#02110c;border:none;
  border-radius:12px;padding:15px;font-weight:700;font-size:.9rem;cursor:pointer;
  box-shadow:0 0 18px -2px rgba(57,255,158,.55),0 0 34px -8px rgba(0,224,255,.5);
  animation:btnGlow 2.4s ease-in-out infinite;transition:transform .1s;
}
.btn:active{transform:scale(.985);}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;animation:none;}

.stats-row{display:flex;gap:10px;margin-bottom:16px;}
.stat-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:0 0 24px -14px rgba(0,224,255,.35);}
.stat-box .n{font-family:var(--fm);font-size:1.6rem;font-weight:800;color:var(--green);text-shadow:0 0 10px rgba(57,255,158,.5);}
.stat-box .l{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}

.section-title{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;display:block;font-weight:600;}

.paired-row{display:flex;align-items:center;justify-content:space-between;background:rgba(0,224,255,.03);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:8px;}
.paired-num{font-weight:600;display:flex;align-items:center;gap:9px;font-family:var(--fm);}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.icon-btn{background:none;border:1px solid var(--blue);color:var(--blue);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.empty{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 0;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:12px 20px;border-radius:12px;font-size:.82rem;z-index:9999;display:none;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px -6px rgba(0,224,255,.4);}

.confirm-box{display:none;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:-2px 0 10px;}
.confirm-box p{font-size:.78rem;color:var(--muted);margin-bottom:10px;}
.confirm-box button{border-radius:9px;padding:9px 16px;font-size:.78rem;font-weight:600;cursor:pointer;margin-right:8px;}
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <img src="https://files.catbox.moe/rg113k.jpg" alt="Monarque Bot">
    <div class="hero-text">
      <div class="name">MONARQUE BOT</div>
      <div class="tag">Owner Panel</div>
    </div>
  </div>

  <div class="card" id="login-card">
    <input type="password" id="owner-code-input" placeholder="Owner code" autocomplete="off">
    <button class="btn" id="login-btn" onclick="ownerLogin()">Unlock</button>
  </div>

  <div id="owner-panel" style="display:none;">

    <div class="stats-row">
      <div class="stat-box">
        <div class="n" id="stat-connected">—</div>
        <div class="l">Connected</div>
      </div>
      <div class="stat-box">
        <div class="n" id="stat-total">—</div>
        <div class="l">Total Numbers</div>
      </div>
    </div>

    <div class="card">
      <span class="section-title">Connected numbers</span>
      <div id="owner-list">
        <div class="empty">Loading...</div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUS_STYLES = {
  connected:{color:'#39ff9e',label:'Connected'},
  connecting:{color:'#00e0ff',label:'Pairing'},
  disconnected:{color:'#4a665c',label:'Disconnected'}
};

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.style.display='block';
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.style.display='none';},3000);
}

function getOwnerToken(){
  return sessionStorage.getItem('sqxOwnerToken');
}

async function api(url,method,body,auth){
  try{
    const opts={method:method||'GET',headers:{}};

    if(body){
      opts.headers['Content-Type']='application/json';
      opts.body=JSON.stringify(body);
    }

    if(auth){
      opts.headers['Authorization']='Bearer '+getOwnerToken();
    }

    const r=await fetch(url,opts);
    return await r.json();
  }catch(e){
    return null;
  }
}

async function ownerLogin(){
  const code=document.getElementById('owner-code-input').value;

  if(!code)return;

  const btn=document.getElementById('login-btn');

  btn.disabled=true;
  btn.textContent='Checking...';

  const r=await api('/api/owner/verify','POST',{code});

  btn.disabled=false;
  btn.textContent='Unlock';

  if(!r||!r.token){
    toast('Invalid code');
    return;
  }

  sessionStorage.setItem('sqxOwnerToken',r.token);

  document.getElementById('login-card').style.display='none';
  document.getElementById('owner-panel').style.display='block';

  loadOwnerSessions();
}

function ownerSessionExpired(){
  toast('Session expired, log in again');

  sessionStorage.removeItem('sqxOwnerToken');

  document.getElementById('login-card').style.display='block';
  document.getElementById('owner-panel').style.display='none';
}

async function loadOwnerSessions(){
  const el=document.getElementById('owner-list');

  const r=await api('/api/owner/sessions','GET',null,true);

  if(!r||r.error){
    ownerSessionExpired();
    return;
  }

  const numbers=r.numbers||[];

  document.getElementById('stat-total').textContent=numbers.length;

  document.getElementById('stat-connected').textContent=
    numbers.filter(n=>n.status==='connected').length;

  if(numbers.length===0){
    el.innerHTML='<div class="empty">No paired numbers right now.</div>';
    return;
  }

  el.innerHTML=numbers.map(n=>{
    const st=STATUS_STYLES[n.status]||STATUS_STYLES.disconnected;

    return `
      <div class="paired-row" id="owner-row-${n.numero}">
        <span class="paired-num">
          <span class="status-dot" style="background:${st.color};box-shadow:0 0 6px ${st.color};"></span>
          +${n.numero}
        </span>

        <button class="icon-btn" onclick="askOwnerDisconnect('${n.numero}')" title="Disconnect">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
        </button>
      </div>

      <div class="confirm-box" id="owner-confirm-${n.numero}">
        <p>Disconnect +${n.numero}?</p>

        <button onclick="ownerDisconnect('${n.numero}')" style="background:var(--green);color:#02110c;border:none;">
          Yes, disconnect
        </button>

        <button onclick="document.getElementById('owner-confirm-${n.numero}').style.display='none'" style="background:transparent;border:1px solid var(--line2);color:var(--text);">
          Cancel
        </button>
      </div>
    `;
  }).join('');
}

function askOwnerDisconnect(number){
  document.getElementById(`owner-confirm-${number}`).style.display='block';
}

async function ownerDisconnect(number){
  const c=document.getElementById(`owner-confirm-${number}`);

  if(c)c.style.display='none';

  const r=await api('/api/owner/disconnect','POST',{number},true);

  if(!r||!r.success){
    toast('Failed to disconnect');
    return;
  }

  toast('Number disconnected');
  loadOwnerSessions();
}

document.getElementById('owner-code-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')ownerLogin();
});

if(getOwnerToken()){
  document.getElementById('login-card').style.display='none';
  document.getElementById('owner-panel').style.display='block';
  loadOwnerSessions();
}
</script>
</body>
</html>
