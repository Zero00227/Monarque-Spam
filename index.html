<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MonarqueGptV1 — IA locale illimitée</title>
<meta name="description" content="IA 100% locale, sans clé API, sans limite, sans censure." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b09'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%232ee6a8' font-family='monospace'%3EM%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<style>
/* ===== CSS : copie celui du rendu ci-dessus, de *{box-sizing... jusqu'à la fin des media queries ===== */
</style>
</head>
<body>
<div id="app">
  <div class="backdrop" id="backdrop"></div>

  <aside id="sidebar">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <div class="brand-name">Monarque<span>GptV1</span></div>
        <div class="brand-sub">local · uncensored</div>
      </div>
    </div>
    <div class="side-pad"><button class="btn-new" id="newChat">＋ Nouvelle discussion</button></div>
    <div class="side-label">Historique</div>
    <div id="convos"></div>
    <div class="side-foot">
      <button id="modelBtn">🧠 <span>Modèles &amp; moteur</span></button>
      <button id="exportBtn">⤓ <span>Exporter la discussion</span></button>
      <button id="settingsBtn">⚙ <span>Paramètres</span></button>
    </div>
  </aside>

  <main>
    <header>
      <button class="hamb" id="hamb">☰</button>
      <span class="badge pro">● 100% LOCAL</span>
      <span class="badge off" id="engineBadge">moteur : non chargé</span>
      <div class="spacer"></div>
      <span class="counter" id="counter"></span>
      <button class="hbtn" id="clearBtn" title="Vider la discussion">🧹</button>
    </header>
    <div id="thread"><div class="inner" id="inner"></div></div>
    <div class="composer-wrap">
      <div class="composer">
        <div class="limitbar" id="limitbar"></div>
        <div class="box">
          <button class="cbtn" id="attachBtn" title="Joindre un fichier">📎</button>
          <input type="file" id="fileInput" multiple hidden />
          <textarea id="input" rows="1" placeholder="Écris ton message… (Entrée = envoyer)"></textarea>
          <button class="cbtn" id="send" title="Envoyer">➤</button>
        </div>
        <div class="foot-note">
          <span>MonarqueGptV1 · <span class="ok">sans clé API · sans limite · sans censure</span></span>
          <span id="tokens">0 tok.</span>
        </div>
      </div>
    </div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head"><h2>⚙ Paramètres</h2><button class="hbtn" id="closeSettings">✕</button></div>
      <div class="modal-body">
        <div class="sect">Comportement</div>
        <div class="field">
          <label>Profil</label>
          <select id="profile">
            <option value="free">Sans filtre (défaut)</option>
            <option value="hard">Sans filtre — strict</option>
            <option value="code">Expert code</option>
            <option value="conseil">Conseil / stratégie</option>
            <option value="prof">Professeur</option>
            <option value="concis">Ultra concis</option>
            <option value="custom">Personnalisé…</option>
          </select>
        </div>
        <div class="field"><label>Prompt système</label><textarea id="systemPrompt"></textarea></div>
        <div class="sect">Génération</div>
        <div class="row2">
          <div class="field"><label>Température <span id="tempVal"></span></label><input type="range" id="temp" min="0" max="1.5" step="0.05" /></div>
          <div class="field"><label>Top-p <span id="topPVal"></span></label><input type="range" id="topP" min="0.1" max="1" step="0.05" /></div>
        </div>
        <div class="field"><label>Pénalité de répétition <span id="repVal"></span></label><input type="range" id="repPen" min="1" max="1.5" step="0.01" /></div>
        <label class="check"><input type="checkbox" id="stream" /><span><span class="ct">Streaming</span><span class="cd">Affichage mot à mot.</span></span></label>
        <label class="check"><input type="checkbox" id="stripThink" /><span><span class="ct">Masquer le raisonnement</span><span class="cd">Retire les blocs &lt;think&gt; des modèles Qwen3.</span></span></label>
        <div class="field" style="margin-top:12px"><label>Budget de contexte (tokens)</label><input type="number" id="ctxBudget" min="512" step="512" /></div>
      </div>
      <div class="modal-foot">
        <button class="btn danger" id="wipe">Tout effacer</button>
        <button class="btn primary" id="save">Enregistrer</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module">
/* ===== JS : copie tout le bloc <script type="module"> du rendu ci-dessus ===== */
</script>
</body>
</html>
