<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0b12">
<meta name="description" content="Monarque Spam — poste de contrôle et de mesure pour l'envoi de messages.">
<title>MONARQUE SPAM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23d9b04a' d='M4 10.5l4.6 3.9L16 6l7.4 8.4L28 10.5l-2.3 13.2H6.3L4 10.5z'/></svg>">
<style>
:root{
  --bg:#0a0b12; --panel:#12131c; --panel2:#181a28; --line:#232536; --line2:#2f3247;
  --ink:#e8e4d8; --mute:#7b7f95; --gold:#d9b04a; --gold2:#f4dd9a;
  --ok:#4fd08a; --bad:#ef5b5b; --warn:#e8b04a; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 620px at 50% -12%,#1c1836 0%,var(--bg) 62%) fixed;
  color:var(--ink); min-height:100vh;
  font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{width:100%;background:#0c0d15;border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:10px 12px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,176,74,.13)}
textarea{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
::selection{background:rgba(217,176,74,.28)}

/* ── écran de garde ── */
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:40px 20px;text-align:center;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crown{width:58px;height:58px;fill:var(--gold);filter:drop-shadow(0 0 22px rgba(217,176,74,.4))}
h1.brand{font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:700;
  font-size:clamp(26px,6.4vw,44px);letter-spacing:.2em;margin:0;padding-left:.2em;
  background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);letter-spacing:.34em;font-size:10px;text-transform:uppercase;margin:-8px 0 4px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);padding:24px;width:min(420px,92vw);box-shadow:0 24px 70px #0009}
.card input{text-align:center;letter-spacing:.3em;font-family:ui-monospace,Menlo,monospace}
.seal{margin-top:12px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);min-height:16px;transition:color .2s}
.seal.ok{color:var(--ok)} .seal.ko{color:var(--bad)}
.social{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.ad{display:flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line);border-radius:99px;
  background:#12131c;transition:.18s;cursor:pointer}
.ad:hover{border-color:var(--gold);transform:translateY(-2px)}
.ad svg{width:17px;height:17px;fill:var(--ink);opacity:.85}
.ad span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.foot{position:fixed;bottom:16px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#4d5063}

/* ── application ── */
#app{display:grid;grid-template-columns:212px 1fr;align-items:start;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:#0c0d15;border-right:1px solid var(--line);
  padding:18px 12px;display:flex;flex-direction:column;gap:3px}
.rail .brandmini{display:flex;align-items:center;gap:9px;padding:0 8px 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.rail .brandmini svg{width:22px;height:22px;fill:var(--gold)}
.rail .brandmini b{font-family:ui-serif,Georgia,serif;font-size:12px;letter-spacing:.16em;color:var(--gold2)}
.rail button{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;color:var(--mute);
  font-size:12.5px;letter-spacing:.03em;transition:.15s;text-align:left;width:100%}
.rail button:hover{background:#14161f;color:var(--ink)}
.rail button.on{background:linear-gradient(90deg,rgba(217,176,74,.16),rgba(217,176,74,.04));color:var(--gold2);
  box-shadow:inset 2px 0 0 var(--gold)}
.rail .sp{flex:1}
.rail .lock{padding:9px 11px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.rail .lock b{color:var(--ok);font-weight:600}
.main{padding:26px 30px 60px;min-width:0}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.head h2{margin:0;font-family:ui-serif,Georgia,serif;font-size:21px;letter-spacing:.06em;font-weight:600}
.head .hint{color:var(--mute);font-size:11.5px;margin-bottom:22px;line-height:1.7;max-width:66ch}
.panel{animation:fade .25s ease}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.box h3{margin:0 0 12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}
.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#17130a;font-weight:700;
  padding:10px 18px;border-radius:9px;letter-spacing:.03em;transition:.15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sec{background:#171927;color:var(--ink);border:1px solid var(--line2);font-weight:500}
.btn.sec:hover{border-color:var(--gold);color:var(--gold2)}
.btn.dng{background:#2a1418;color:#f0a0a0;border:1px solid #4a2028}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px}
.kv b{color:var(--mute);font-weight:400;font-size:12px}
.kv .v{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.bar{height:6px;background:#0c0d15;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.bar i.run{background:linear-gradient(90deg,#3fae74,var(--ok))}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--mute);font-weight:400;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;padding:7px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid #1a1c28;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
tr:hover td{background:#14161f}
.tag{padding:2px 8px;border-radius:99px;font-size:10px;letter-spacing:.06em;white-space:nowrap;font-family:inherit}
.t-ok{background:#12281d;color:#7fd6a8;border:1px solid #24503a}
.t-bad{background:#2a1418;color:#f0a0a0;border:1px solid #4a2028}
.t-warn{background:#2a2214;color:#e8c67a;border:1px solid #4a3c20}
.t-idle{background:#171927;color:var(--mute);border:1px solid var(--line2)}
.cibar{height:7px;background:#0c0d15;border-radius:99px;position:relative;min-width:80px;border:1px solid var(--line)}
.cibar i{position:absolute;height:100%;border-radius:99px;background:#3fae74}
.cibar i.d{background:#c04848}
.log{max-height:190px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute);line-height:1.9}
.log b{color:var(--ink);font-weight:400}
.warn{background:#221a10;border:1px solid #45381c;color:#e8c67a;padding:10px 13px;border-radius:9px;
  font-size:12px;line-height:1.7;margin-bottom:14px}
.axg{margin-bottom:11px}
.axg>span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.axg .vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.axg label{display:inline-flex;align-items:center;gap:5px;margin:0;background:#12131c;border:1px solid var(--line);
  border-radius:99px;padding:4px 11px;font-size:11px;letter-spacing:0;text-transform:none;color:var(--mute);cursor:pointer;transition:.15s}
.axg label:hover{border-color:var(--line2)}
.axg input{width:auto;display:none}
.axg input:checked+span{color:var(--gold2)}
.axg label:has(input:checked){background:rgba(217,176,74,.13);border-color:var(--gold)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#1a1c28;border:1px solid var(--line2);border-radius:99px;padding:9px 20px;font-size:12px;
  transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  .rail{height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;align-items:center}
  .rail .brandmini{border:0;padding:0 10px 0 4px;margin:0}
  .rail .sp,.rail .lock{display:none}
  .rail button{width:auto;white-space:nowrap;padding:8px 12px}
  .main{padding:18px}
}
</style>
</head>

    if (this.cfg.kind === 'wame') {
      try { root.open('https://wa.me/' + String(m.target).replace(/\D/g,'') + '?text=' + encodeURIComponent(m.text), '_blank'); } catch (e) {}
      return Promise.resolve({ status:200, body:'opened' }); }
    return U.sleep(20).then(function () { return Math.random() < .08
      ? { status:429, body:'Too Many Requests: retry after ' + (1 + Math.floor(Math.random()*3)) }
      : { status:200, body:'ok' }; });
  },
  observe: function (e) { if (this.cfg.kind !== 'dryrun') return U.sleep(600).then(function () { return 'inconnu'; });
    var MOD = { lien:{ brut:.1, tme:.18, raccourci:.3 }, script:{ cyrillique:-.12, invisible:-.16, pleine_largeur:-.1 },
      casse:{ CAPS:.14 }, taille:{ court:.05, long:.1 }, forme:{ forward:.2, legende_media:.12, via_bot:.08, reponse:-.06 }, emoji:{ '5':.07 } };
    var p = .5, v = e.variant || {};
    Object.keys(v).forEach(function (k) { if (MOD[k] && MOD[k][v[k]] != null) p += MOD[k][v[k]]; });
    p = U.clamp(p + (e.risk || 0) / 200, .03, .96);
    return U.sleep(3).then(function () { return Math.random() < p ? 'supprime' : 'survecu'; }); }
};

 /* ═════ 10. CAMPAGNE (envoi) ═════ */
var Camp = { running: false, lim: null, log: [], rows: [],
  cfg: { targets: [], templates: ['Monarque — https://t.me/monarque'], delay: [1200, 3000],
         hourlyCap: 120, maxRetries: 3, cursor: 0, hourStart: 0, hourCount: 0, rotate: true },
  load: function () { return Store.get('camp', 'cfg').then(function (c) {
    if (c) for (var k in c) Camp.cfg[k] = c[k]; return Camp.cfg; }); },
  save: function () { return Store.put('camp', 'cfg', Camp.cfg); },
  stop: function () { this.running = false; },
  run: function () {
    if (this.running) return;
    if (!this.cfg.targets.length) return UI.toast('aucune cible');
    this.running = true; this.lim = this.lim || new Limiter({ rate: 1 });
    var self = this;
    (function step() {
      if (!self.running) { self.running = false; self.save(); return UI.render(); }
      if (self.cfg.cursor >= self.cfg.targets.length) { self.push('— terminé —'); self.running = false; self.save(); return UI.render(); }
      var t0 = U.now();
      if (t0 - self.cfg.hourStart > 3600000) { self.cfg.hourStart = t0; self.cfg.hourCount = 0; }
      if (self.cfg.hourCount >= self.cfg.hourlyCap) {
        var p = Math.min(self.cfg.hourStart + 3600000 - t0, 60000);
        self.push('plafond horaire — pause ' + Math.round(p/1000) + ' s');
        return U.sleep(p).then(step); }
      var target = self.cfg.targets[self.cfg.cursor];
      var tpl = self.cfg.templates[self.cfg.cursor % self.cfg.templates.length];
      var text = self.cfg.rotate ? N.mutate(tpl, self.cfg.cursor) : tpl;
      var risk = N.score(text).score, done = false, a = 0;
      (function attempt() {
        if (done || a > self.cfg.maxRetries) return finish();
        a++;
        return Transport.send({ text: text, target: target }).then(function (r) {
          var c = classify(r);
          if (c.signal === 'ok') { done = true; self.cfg.hourCount++; self.lim.report('ok');
            self.push('OK    ' + target); return finish(); }
          if (c.signal === 'skip') { done = true; self.push('passé ' + target); return finish(); }
          self.lim.report(c.signal, c.waitMs);
          self.push('attente ' + Math.round(c.waitMs/1000) + ' s  ' + target);
          return U.sleep(c.waitMs).then(attempt);
        }).catch(function (e) { self.push('erreur ' + e.message); return U.sleep(2000).then(attempt); });
      })();
      function finish() {
        self.rows.push({ t: U.now(), target: target, risk: risk, ok: done });
        self.cfg.cursor++; self.save(); UI.render();
        if (self.running) U.sleep(self.lim.delay()).then(step);
      }
    })();
  },
  push: function (m) { this.log.push(U.hms(U.now()) + '  ' + m); if (this.log.length > 300) this.log.shift(); UI.render(); },
  reset: function () { this.cfg.cursor = 0; this.cfg.hourCount = 0; this.cfg.hourStart = 0; this.log = []; this.save(); UI.render(); }
};

/* ═════ 11. PILOTE (sondage) ═════ */
function Pilot(o) { this.t = o.transport; this.lim = new Limiter({ rate: o.rate || 12 }); this.rows = []; }
Pilot.prototype.run = function (list) { var self = this, i = 0, chain = Promise.resolve();
  this.rows = [];
  list.forEach(function (v) { chain = chain.then(function () {
    if (i >= 900) return;
    var text = Probe.payload(v, i), risk = N.score(text);
    return Transport.send({ text: text, variant: v, risk: risk.score }).then(function (r) {
      var c = classify(r); self.lim.report(c.signal, c.waitMs);
      var row = { i:i, variant:v, risk:risk.score, transport:c.signal, outcome:'inconnu' };
      self.rows.push(row); i++;
      return Transport.observe(row).then(function (o) { row.outcome = o; }); }); }); });
  return chain.then(function () { return { n: self.rows.length, analyse: Probe.analyse(self.rows), lim: self.lim.stats() }; }); };

function boot() {
  Store.init().then(function () { return Store.get('cfg', 'transport'); }).then(function (t) {
    if (t) Transport.cfg = t;
    return Camp.load();
  }).then(function () {
    /* porte */
    var input = doc.getElementById('code'), seal = doc.getElementById('seal');
    var timer = null;
    function tryCode() {
      var v = input.value; if (!v) { seal.textContent = 'en attente du sceau'; seal.className = 'seal'; return; }
      seal.textContent = 'vérification…'; seal.className = 'seal';
      Gate.configured().then(function (cfg) {
        var job = cfg ? Gate.verify(v) : Gate.set(v).then(function () { return true; });
        return job.then(function (ok) {
          if (ok) { seal.textContent = 'sceau reconnu'; seal.className = 'seal ok';
            setTimeout(enter, 420); }
          else { seal.textContent = 'sceau refusé'; seal.className = 'seal ko'; }
        });
      }).catch(function () { seal.textContent = 'erreur de dérivation'; seal.className = 'seal ko'; });
    }
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(tryCode, 260); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); tryCode(); } });

    function enter() {
      doc.getElementById('gate').hidden = true;
      doc.getElementById('app').hidden = false;
      UI.render();
      if (Camp.cfg.cursor && Camp.cfg.cursor < Camp.cfg.targets.length)
        UI.toast('campagne en pause à ' + Camp.cfg.cursor + '/' + Camp.cfg.targets.length);
    }
    if (Gate.unlocked()) { doc.getElementById('gate').hidden = true; doc.getElementById('app').hidden = false; UI.render(); }
    else setTimeout(function () { input.focus(); }, 60);

    doc.querySelector('.rail').onclick = function (e) {
      var b = e.target.closest('button[data-v]'); if (!b) return;
      if (b.dataset.v === '__lock') { Gate.lock(); location.reload(); return; }
      UI.view = b.dataset.v; UI.render();
    };
    doc.addEventListener('keydown', function (e) {
      if (e.altKey && e.key >= '1' && e.key <= '6') {
        var vs = ['statut', 'envoi', 'analyse', 'registre', 'passerelle', 'journal'];
        UI.view = vs[+e.key - 1]; UI.render(); }
    });
    root.addEventListener('beforeunload', function (e) { if (Camp.running) { e.preventDefault(); e.returnValue = ''; } });
    if (root.console) console.log('%cMONARQUE SPAM v' + V, 'color:#d9b04a;font-weight:700');
  }).catch(function (e) { if (root.console) console.error('Monarque:', e); });
}

if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot); else boot();
})(globalThis, document);
</script>
</body>
