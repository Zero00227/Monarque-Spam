  <!-- Importation de la police futuriste Orbitron depuis Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Thème sombre global et application de la police futuriste */
    body {
      background-color: #0d0d0d !important;
      color: #ffffff !important;
      font-family: 'Orbitron', sans-serif !important;
      letter-spacing: 2px;
    }

    /* Animation du néon clignotant Vert et Rouge */
    @keyframes neonBlink {
      0%, 100% {
        border-color: #00ff00;
        box-shadow: 0 0 5px #00ff00, 0 0 15px #00ff00;
      }
      50% {
        border-color: #ff0000;
        box-shadow: 0 0 5px #ff0000, 0 0 15px #ff0000;
      }
    }

    /* Style des titres pour accentuer l'effet futuriste */
    h1 {
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* Application du style aux bordures des blocs de saisie, boutons et éléments ad */
    .carre, .carre2, .ad, .pass {
      border: 2px solid #00ff00;
      border-radius: 8px;
      animation: neonBlink 1.5s infinite ease-in-out;
      background-color: #1a1a1a !important;
      color: #fff !important;
      font-family: 'Orbitron', sans-serif !important;
    }

    /* Configuration du bouton de contact comme un lien cliquable propre */
    a.ad {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      padding: 10px;
      cursor: pointer;
    }
    
    a.ad h4 {
      margin: 0;
      color: #ffffff;
    }

    /* Ajustement pour l'input de mot de passe */
    .pass {
      outline: none;
      padding: 10px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      animation: none;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    
    .carre2 {
      cursor: pointer;
      text-align: center;
      font-weight: 700;
    }
  </style>
</head>
