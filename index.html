<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>
      Monarque Spam
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://googleapis.com" rel="stylesheet" />
    <style>
      :root{
  --bg: #050508;
  --panel: #0d0d14;
  --border: #1f3d3d;
  --neon-blue: #00f0ff;
  --neon-green: #39ff14;
  --text: #e2e8f0;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:"JetBrains Mono", monospace;
  background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
  background: #050508;
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Animation de clignotement pour les néons */
@keyframes neonFlicker {
  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
    opacity: 1;
  }
  20%, 24%, 55% {
    opacity: 0.7;
  }
}

.panel{
  width:380px;
  background: var(--panel);
  border:2px solid var(--neon-blue);
  border-radius:20px;
  padding:26px;
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
  animation: neonFlicker 4s infinite alternate;
}

.avatar{
  width:86px;
  height:86px;
  margin:0 auto 14px;
  border-radius:50%;
  background:url("https://catbox.moe") center/cover no-repeat;
  border: 2px solid var(--neon-green);
  box-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
}

h1{
  text-align:center;
  margin:0;
  font-size:22px;
  color:var(--neon-blue);
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
}

.sub{
  text-align:center;
  font-size:12px;
  color: var(--neon-green);
  opacity:.9;
  margin:6px 0 18px;
  text-shadow: 0 0 5px rgba(57, 255, 20, 0.4);
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  background:#09090f;
  border:1px solid var(--neon-blue);
  color:var(--text);
  margin-bottom:12px;
  font-family:"JetBrains Mono", monospace;
  font-size:13px;
  box-shadow: 0 0 5px rgba(0, 240, 255, 0.1);
  outline: none;
}

input:focus {
  border-color: var(--neon-green);
  box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
}

.btns{display:flex;gap:10px;margin-bottom:18px}

button{
  flex:1;
  padding:12px;
  border-radius:12px;
  border: 1px solid var(--neon-green);
  background: transparent;
  color: var(--neon-green);
  font-family:"JetBrains Mono", monospace;
  font-size:13px;
  cursor:pointer;
  box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
  transition: all 0.3s ease;
}

button.active{
  background: rgba(57, 255, 20, 0.1);
  font-weight: 600;
  text-shadow: 0 0 5px var(--neon-green);
}

button:hover {
  background: var(--neon-green);
  color: #000;
  box-shadow: 0 0 15px var(--neon-green);
}

.logs{
  background:#040407;
  border:1px solid var(--neon-blue);
  border-radius:14px;
  padding:14px;
  min-height:180px;
  font-size:14px;
  line-height:1.6;
  color: var(--neon-green);
  overflow:hidden;
  box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.05);
}

.progress-container{
  width:100%;
  height:14px;
  background:#09090f;
  border: 1px solid var(--neon-blue);
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
  border-radius:12px;
  transition:width 0.2s ease;
  box-shadow: 0 0 10px var(--neon-blue);
}

.log{animation:fadeIn .4s ease}
.done{color: var(--neon-blue); font-weight:600; text-shadow: 0 0 8px var(--neon-blue)}

.footer{text-align:center;margin-top:16px;font-size:10px;color: var(--neon-blue); opacity:.6}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="avatar">
      </div>
      <h1>
        Monarque Spam
      </h1>
      <div class="sub">
        WHATSAPP REPORT SYSTEM
      </div>
      <input id="number" placeholder="Numéro WhatsApp à signaler" />
      <div class="btns">
        <button id="signalBtn" class="active">
          SIGNALER
        </button>
      </div>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar">
        </div>
      </div>
      <div class="logs" id="logs">
        <div class="log">
          [ARCANE] init::0x9fa3c4
        </div>
      </div>
      <div class="footer">
        Powered by Monarque
      </div>
    </div>
    <audio id="sound" src="https://catbox.moe">
    </audio>
    <script>
      const logs = document.getElementById("logs");
      const signalBtn = document.getElementById("signalBtn");
      const progressBar = document.getElementById("progressBar");
      const sound = document.getElementById("sound");

      const logPool = [
        "[ARCANE] payload.inject()",
        "[ARCANE] stream@ws://node/Δ7a91",
        "[ARCANE] xor.decrypt[0x4f9a]",
        "[ARCANE] hook.whatsapp.report",
        "[ARCANE] memory.flush :: 0x0007ff",
        "[ARCANE] socket.handshake::ok",
        "[ARCANE] heap.alloc[512kb]",
        "[ARCANE] api.whatsapp/v9/report",
        "[ARCANE] thread.spawn::reporter",
        "[ARCANE] checksum.bypass ✓",
        "[ARCANE] routing.tunnel::active",
        "[ARCANE] signal.push.queue",
        "[ARCANE] kernel.map::patched",
        "[ARCANE] entropy.sync",
        "[ARCANE] watchdog.disable",
        "[ARCANE] tx.commit::node-7",
        "[ARCANE] buffer.rotate",
        "[ARCANE] process.obfuscate"
      ];

      const MAX_TIME = 120;
      const LOG_BATCH = 8;
      let started = false;
      let elapsed = 0;
      let currentLogs = [];

      document.body.addEventListener("click",()=>{
        if(sound.paused){
          sound.loop = true;
          sound.play().catch(()=>{});
        }
      });

      signalBtn.onclick = ()=>{
        if(started) return;
        started = true;
        elapsed = 0;
        currentLogs = [];
        logs.innerHTML = "";
        progressBar.style.width = "0%";
        sound.currentTime = 0;
        sound.play().catch(()=>{});

        const timer = setInterval(()=>{
          elapsed++;
          let percent = Math.floor((elapsed/MAX_TIME)*100);
          progressBar.style.width = percent + "%";

          if(currentLogs.length >= LOG_BATCH){
            currentLogs = [];
            logs.innerHTML = "";
          }

          for(let i=0; i<LOG_BATCH; i++){
            const line = document.createElement("div");
            line.className="log";
            const base = logPool[Math.floor(Math.random()*logPool.length)];
            const noise = Math.random().toString(16).slice(2,6);
            line.textContent = `${base} :: 0x${noise}`;
            logs.appendChild(line);
            currentLogs.push(line);
          }

          logs.scrollTop = logs.scrollHeight;

          if(elapsed >= MAX_TIME){
            clearInterval(timer);
            logs.innerHTML = "";
            const end = document.createElement("div");
            end.className="log done";
            end.textContent = "✔ SIGNALMENT TERMINÉ";
            logs.appendChild(end);
            progressBar.style.width = "100%";
            sound.pause();
            sound.currentTime = 0;
          }

        }, 200);
      };
    </script>
  </body>
</html>
